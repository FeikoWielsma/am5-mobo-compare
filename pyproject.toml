[project]
name = "am5-mobo-compare"
version = "0.1.0"
description = "AM5 Motherboard Comparison Tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.16.3",
    "flask>=3.1.3",
    "flask-compress>=1.24",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
]

[tool.uv]
package = false
