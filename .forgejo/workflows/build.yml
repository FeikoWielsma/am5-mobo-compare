name: Build and Deploy

on:
  push:
    branches:
      - staging
    paths-ignore:
      - 'README.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: docker-build
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
        with:
          lfs: true

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v5

      - name: Install Python deps
        run: uv pip install --system -r requirements.txt --break-system-packages

      - name: Fetch latest spreadsheet
        run: python scripts/fetch_sheet.py

      - name: Install bws CLI
        shell: sh
        run: |
          curl -sLl https://bws.bitwarden.com/install | sh -s -- --install-dir /usr/local/bin --force
          chmod +x /usr/local/bin/bws

      - name: Login to Forgejo Registry
        shell: sh
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          REGISTRY_TOKEN=$(/usr/local/bin/bws run -- printenv REGISTRY_TOKEN)
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "Error: REGISTRY_TOKEN is empty"
            exit 1
          fi
          echo "$REGISTRY_TOKEN" | docker login git.feikowielsma.nl -u feiko --password-stdin

      - name: Build and Push
        shell: sh
        run: |
          docker build -t git.feikowielsma.nl/feiko/am5-mobo-compare:staging .
          docker push git.feikowielsma.nl/feiko/am5-mobo-compare:staging
